name: Package and tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]" build
      - run: python -m pytest -q
      - run: python examples/make_demo.py
      - run: gsoptviz inspect demo_sequence/manifest.json
      - run: gsoptviz export demo_sequence/manifest.json --output artifacts/demo.html
      - run: python -m build
